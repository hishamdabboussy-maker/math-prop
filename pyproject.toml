[project]
name = "math-prop"
version = "0.0.1"
description = "Research simulator for proprietary trading firm evaluations and funded accounts"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
